spring.application.name=EventManagementSystem
server.port=${PORT:8082}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ========================================================
# Database
# H2 remains the local fallback. Set the three SPRING_DATASOURCE_*
# variables in Railway to use a persistent MySQL database.
# ========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# A stable secret of at least 32 bytes is recommended so tokens survive restarts.
# Without it, the application generates a secure temporary key for this process.
app.jwt.secret=${JWT_SECRET:}

# Comma-separated exact origins. Override this for additional deployed clients.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://event-management-system-smoky-xi.vercel.app}
